[package]
name = "adk-ui"
version = "3.0.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
authors = ["James Karanja Maina <james.karanja@zavora.ai>"]
description = "Extension catalogs for ADK-Rust agent-drawn UI: charts, metrics, pages and scenes on adk-surface's genui, which keeps drawing, provenance and approvals"
repository = "https://github.com/zavora-ai/adk-ui"
documentation = "https://docs.rs/adk-ui"
keywords = ["ai", "agent", "ui", "generative", "a2ui"]
categories = ["gui", "web-programming"]
readme = "README.md"
exclude = [".cargo", "packages", "examples/custom_host", "docs/archive", "package.json", "package-lock.json"]

# adk-ui 3 adds catalogs to adk-surface's `genui`; it owns no render tool, protocol,
# provenance or approval path (spec 3.3 decision 11, as amended). Until ADK-Rust 3.0 is on
# crates.io, point `adk-*` at an adk-rust checkout: copy `.cargo/config.toml.example` to
# `.cargo/config.toml` (untracked) and set its paths.

[dependencies]
adk-surface = { version = "3.0.0", default-features = false, features = ["genui"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# `apps`: the MCP server that shows model-written three.js in genui-apps' sandbox.
regex = { version = "1", optional = true }
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"], optional = true }

[features]
default = []
# An MCP server (stdio) whose `show_3d_app` tool shows model-written three.js as an MCP App,
# only ever framed in genui-apps' sandbox on a second origin: `adk_ui::apps::ThreeApps` and
# the `adk-ui-apps` binary.
apps = ["dep:regex", "dep:rmcp", "dep:tokio"]

[dev-dependencies]
adk-core = "3.0.0"
adk-devtools = "3.0.0"
adk-harness = { version = "3.0.0", features = ["kernel"] }
adk-kernel = "3.0.0"
adk-model = { version = "3.0.0", default-features = false, features = ["anthropic"] }
adk-runner = "3.0.0"
adk-server = { version = "3.0.0", features = ["approvals"] }
adk-session = "3.0.0"
adk-surface = { version = "3.0.0", features = ["web", "genui", "genui-apps"] }
adk-tool = { version = "3.0.0", features = ["mcp-apps"] }
async-trait = "0.1"
axum = "0.8"
futures = "0.3"
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
tower = { version = "0.5", features = ["util"] }

# The `show_3d_app` MCP server over stdio.
[[bin]]
name = "adk-ui-apps"
path = "src/bin/adk-ui-apps.rs"
required-features = ["apps"]

# The web home over a scripted agent that draws in adk-ui's catalogs.
[[example]]
name = "insight_home"
path = "examples/insight_home.rs"

# A real agent on Claude that answers with adk-ui's catalogs; configured from the environment.
[[example]]
name = "insight_agent"
path = "examples/insight_agent.rs"

# `show_3d_app` end to end through genui-apps.
[[test]]
name = "apps_tests"
path = "tests/apps_tests.rs"
required-features = ["apps"]
