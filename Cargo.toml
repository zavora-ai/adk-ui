[package]
name = "adk-ui"
version = "3.0.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
authors = ["James Karanja Maina <james.karanja@zavora.ai>"]
description = "Extension catalogs for ADK-Rust agent-drawn UI: charts, metrics, pages and scenes on adk-surface's genui, which keeps drawing, provenance and approvals"
repository = "https://github.com/zavora-ai/adk-ui"
documentation = "https://docs.rs/adk-ui"
keywords = ["ai", "agent", "ui", "generative", "a2ui"]
categories = ["gui", "web-programming"]
readme = "README.md"
# What the crate ships: the library, its catalog documents and its docs. The examples, the
# tests, the sample drawings and the React package stay in the repository.
include = [
    "/src/**/*",
    "/catalogs/**/*",
    "/docs/ARCHITECTURE.md",
    "/docs/BRAND_KITS.md",
    "/docs/MIGRATING_TO_3.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
]

# adk-ui 3 adds catalogs to adk-surface's `genui`; it owns no render tool, protocol,
# provenance or approval path (spec 3.3 decision 11, as amended). To build against an
# unreleased adk-rust, copy `.cargo/config.toml.example` to `.cargo/config.toml` (untracked)
# and set its paths.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
adk-surface = { version = "3.0.0", default-features = false, features = ["genui"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# `apps`: adk-ui's MCP Apps server (`show_3d_app`, `show_drawing`).
regex = { version = "1", optional = true }
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"], optional = true }

[features]
default = []
# An MCP Apps server (stdio): `show_3d_app` shows model-written three.js, framed in
# genui-apps' sandbox on a second origin; `show_drawing` shows a checked drawing read-only in
# any MCP Apps host. `adk_ui::apps::UiApps` and the `adk-ui-apps` binary.
apps = ["dep:regex", "dep:rmcp", "dep:tokio"]

[dev-dependencies]
adk-core = "3.0.0"
adk-devtools = "3.0.0"
adk-harness = { version = "3.0.0", features = ["kernel"] }
adk-kernel = "3.0.0"
adk-model = { version = "3.0.0", default-features = false, features = ["anthropic"] }
adk-runner = "3.0.0"
adk-server = { version = "3.0.0", features = ["approvals"] }
adk-session = "3.0.0"
adk-surface = { version = "3.0.0", features = ["web", "genui", "genui-apps"] }
adk-tool = { version = "3.0.0", features = ["mcp-apps"] }
async-trait = "0.1"
axum = "0.8"
futures = "0.3"
http-body-util = "0.1"
# Checks the A2UI 1.0 catalog documents against the pinned A2UI 1.0 meta-schema.
jsonschema = { version = "0.47", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
tower = { version = "0.5", features = ["util"] }

# adk-ui's MCP Apps server over stdio.
[[bin]]
name = "adk-ui-apps"
path = "src/bin/adk-ui-apps.rs"
required-features = ["apps"]

# The web home over a scripted agent that draws in adk-ui's catalogs.
[[example]]
name = "insight_home"
path = "examples/insight_home.rs"

# A real agent on Claude that answers with adk-ui's catalogs; configured from the environment.
[[example]]
name = "insight_agent"
path = "examples/insight_agent.rs"

# Scores the sample drawings, or a model's, the way genui will judge them.
[[example]]
name = "drawing_eval"
path = "examples/drawing_eval.rs"

# The MCP Apps server end to end: `show_3d_app` through genui-apps, both tools over stdio.
[[test]]
name = "apps_tests"
path = "tests/apps_tests.rs"
required-features = ["apps"]
